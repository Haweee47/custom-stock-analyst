name: 앱 깨워 두기

# Streamlit Community Cloud는 한동안 아무도 안 들어오면 앱을 재운다. 다시 열면
# "get this app back up" 버튼부터 보이고 깨어나는 데 시간이 걸린다.
# 원티드 AI Championship 예선은 유저 투표(2026-09-21 ~ 10-05)가 심사에 들어가므로,
# 심사위원이나 투표자가 링크를 눌렀을 때 잠들어 있으면 그대로 손해다.
#
# 단순 HTTP 요청으로는 앱이 깨지 않는다. 앱은 브라우저가 웹소켓을 열어야 실행되므로
# 실제 브라우저로 접속해 화면이 그려지는 것까지 확인한다.

on:
  schedule:
    # 12시간 방문이 없으면 잠든다. 4시간마다 들르면 한두 번 실패해도 여유가 있다.
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 데모데이(10-17)가 지나면 더 돌릴 이유가 없다. 켜 두고 잊어버리는 것을 막는다.
      - name: 기간 확인
        id: window
        run: |
          if [ "$(date -u +%Y-%m-%d)" \> "2026-10-18" ]; then
            echo "심사 기간이 끝나 건너뜁니다. 이 워크플로는 지워도 됩니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.window.outputs.skip != 'true'
        with:
          node-version: "20"

      - name: 브라우저 설치
        if: steps.window.outputs.skip != 'true'
        run: npx --yes playwright@1.47.2 install --with-deps chromium

      - name: 앱 열어 보기
        if: steps.window.outputs.skip != 'true'
        env:
          APP_URL: https://custom-stock-analyst.streamlit.app
        run: |
          npm install --no-save playwright@1.47.2
          node -e "
          const { chromium } = require('playwright');

          // Streamlit Cloud는 앱을 iframe 안에서 그린다. 바깥 프레임만 보면 영원히 빈 화면이라
          // 이 확인이 매번 실패했다(9/19). 앱 글자가 보이는 프레임을 찾아야 한다.
          const findApp = async (page) => {
            for (const frame of page.frames()) {
              const hit = await frame.locator('text=리포트 셀프바').count().catch(() => 0);
              if (hit) return frame;
            }
            return null;
          };

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(process.env.APP_URL, { waitUntil: 'domcontentloaded', timeout: 90000 });

            // 잠들어 있으면 깨우는 버튼이 먼저 나온다. 깨우기는 자동이 아니라 클릭이다.
            const wake = page.getByRole('button', { name: /get this app back up/i });
            if (await wake.count()) {
              console.log('앱이 잠들어 있어 깨웁니다.');
              await wake.first().click();
            }

            let app = null;
            for (let i = 0; i < 24 && !app; i++) {
              await page.waitForTimeout(5000);
              app = await findApp(page);
            }
            if (!app) throw new Error('2분을 기다려도 앱 화면이 그려지지 않았습니다.');

            // 화면이 그려진 뒤에도 잠시 머문다. 접속 기록이 남아야 잠들기 시계가 초기화된다.
            await page.waitForTimeout(15000);
            const text = (await app.locator('body').innerText()).replace(/\s+/g, ' ').slice(0, 160);
            console.log('앱 화면 확인:', text);
            await page.screenshot({ path: 'app.png', fullPage: false });
            await browser.close();
          })().catch((error) => { console.error('실패:', error.message); process.exit(1); });
          "

      - name: 화면 남기기
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: app.png
          retention-days: 7
          if-no-files-found: ignore
