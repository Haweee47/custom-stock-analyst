name: 웹사이트 빌드

# 저장된 리포트를 정적 페이지로 만들어 site-dist 브랜치에 올린다.
# Cloudflare Pages가 그 브랜치를 그대로 서빙한다(빌드 명령 없음).
#
# 왜 이렇게 나눴나:
#   - 호스팅 쪽에 API 토큰을 주지 않아도 된다. Cloudflare는 브랜치만 바라본다.
#   - 파이썬 실행 환경을 호스팅에 맞출 필요가 없다. 빌드는 여기서 끝난다.
#   - 호스팅을 옮길 때 브랜치만 다시 연결하면 된다(Pages, Netlify, Vercel 모두 가능).
#
# Streamlit Community Cloud는 약관상 상업적 이용이 금지돼 광고를 붙일 수 없고,
# 주소가 하나뿐이라 검색엔진이 색인할 것도 없다. 그래서 정적 페이지로 옮긴다.
# 리포트를 새로 만들지 않고 캐시만 읽으므로 Gemini 호출이 없다(비용 0).

on:
  workflow_run:
    workflows: ["일일 데이터 갱신"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: site-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      # 도메인을 사면 저장소 Variables에 SITE_BASE_URL을 넣는다.
      # canonical·사이트맵·robots가 한 번에 따라간다.
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://report-selfbar.pages.dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 페이지 생성
        run: python site_build.py

      - name: 결과 확인
        # 빈 사이트를 올리면 검색엔진이 색인해 둔 페이지가 통째로 사라진다.
        run: |
          COUNT=$(find site -name "*.html" | wc -l)
          echo "생성된 페이지 ${COUNT}쪽"
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::페이지가 너무 적습니다(${COUNT}쪽). 배포를 멈춥니다."
            exit 1
          fi

      - name: site-dist 브랜치에 올리기
        run: |
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 정적 호스팅이 _로 시작하는 폴더를 건너뛰지 않게 한다
          touch .nojekyll
          git add -A
          git commit -q -m "site: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:site-dist
          echo "site-dist 브랜치에 올렸습니다."
